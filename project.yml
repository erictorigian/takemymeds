name: TakeMyMeds
options:
  bundleIdPrefix: com.eric
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  TakeMyMeds:
    type: application
    platform: iOS
    sources:
      - path: TakeMyMeds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eric.TakeMyMeds
        INFOPLIST_FILE: TakeMyMeds/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    plist:
      path: TakeMyMeds/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: TakeMyMeds
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
