name: TakeMyMeds
options:
  bundleIdPrefix: com.eric
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

targets:
  TakeMyMeds:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TakeMyMeds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eric.TakeMyMeds
        INFOPLIST_FILE: TakeMyMeds/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"

schemes:
  TakeMyMeds:
    build:
      targets:
        TakeMyMeds: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
